<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robo Eyes</title>
<style>
  :root{
    --orange:#ff7a1a;
    --glow:255,122,26;           /* glow colour (r,g,b) */
    --glowt:7.4s;              /* one low→high→low glow cycle */
    --s:min(26vw,40vh);          /* eye size */
    --gap:14vw;                  /* distance between eyes (CONFIG.eyeGap) */
    --bw:8;                      /* border thickness (CONFIG.borderWidth) */
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  .stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:var(--gap)}

  .eye{
    width:var(--s);height:var(--s);
    transform:translate(var(--x,0),var(--y,0)) scale(var(--k,1)) scaleY(var(--sy,1));
    transition:transform .18s ease;
    animation:glow var(--glowt) ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 calc(var(--s)*.015) rgba(var(--glow),.25))}
    50%{filter:drop-shadow(0 0 calc(var(--s)*.07) rgba(var(--glow),.9)) drop-shadow(0 0 calc(var(--s)*.16) rgba(var(--glow),.55))}
  }
  .eye svg{width:100%;height:100%;display:block;overflow:visible}

  /* every shape = border only */
  .sh{fill:none;stroke:var(--orange);stroke-width:var(--bw);stroke-linejoin:round;stroke-linecap:round;
      opacity:0;transform:scale(.7);transform-origin:50% 50%;transform-box:view-box;
      transition:opacity .3s ease,transform .4s cubic-bezier(.3,1.4,.5,1),stroke .3s}
  .eye.r .mir{transform:scaleX(-1);transform-origin:50% 50%;transform-box:view-box}

  body[data-mood="default"]  .s-default,
  body[data-mood="mood_1"]   .s-mood_1,
  body[data-mood="angry"]    .s-angry,
  body[data-mood="thinking"] .s-thinking,
  body[data-mood="happy"]    .s-happy{opacity:1;transform:scale(1)}

  /* ANGRY – deeper orange */
  body[data-mood="angry"]{--orange:#ff5a0a;--glow:255,12,10}

  /* THINKING – look up/side, left eye smaller */
  body[data-mood="thinking"] .eye{--x:calc(var(--s)*.18);--y:calc(var(--s)*-.12)}
  body[data-mood="thinking"] .eye.l{--k:.78}

  /* HAPPY – gentle hop */
  body[data-mood="happy"] .eye{animation:glow var(--glow-t) ease-in-out infinite,hop 1.2s ease-in-out infinite}
  @keyframes hop{50%{translate:0 calc(var(--s)*-.05)}}

  /* thinking dots */
  .dots{position:absolute;left:50%;top:calc(50% + var(--s)*.62);transform:translateX(-50%);
        display:flex;gap:calc(var(--s)*.07);opacity:0;transition:opacity .3s;pointer-events:none}
  .dots i{width:calc(var(--s)*.07);height:calc(var(--s)*.07);border-radius:50%;background:var(--orange);
          box-shadow:0 0 calc(var(--s)*.05) rgba(var(--glow),.9);animation:dot 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(calc(var(--s)*-.05));opacity:1}}
  body[data-mood="thinking"] .dots{opacity:1}

  @media (prefers-reduced-motion:reduce){.eye,.dots i{animation:none!important}}
</style>
</head>
<body data-mood="default">
<div class="stage">
  <div class="eye l">
    <svg viewBox="0 0 100 100">
      <polygon class="sh s-default" points="50,12 90,86 10,86"/>
      <circle  class="sh s-mood_1" cx="50" cy="50" r="40"/>
      <path    class="sh s-angry mir" d="M15.4 30 L89.4 56.9 A40 40 0 1 1 15.4 30 Z"/>
      <path    class="sh s-thinking" d="M14.3 32 L85.7 32 A40 40 0 1 1 14.3 32 Z"/>
      <path    class="sh s-happy" d="M10 68 A40 40 0 0 1 90 68 A40 18 0 0 0 10 68 Z"/>
    </svg>
  </div>
  <div class="eye r">
    <svg viewBox="0 0 100 100">
      <polygon class="sh s-default" points="50,12 90,86 10,86"/>
      <circle  class="sh s-mood_1" cx="50" cy="50" r="40"/>
      <path    class="sh s-angry mir" d="M15.4 30 L89.4 56.9 A40 40 0 1 1 15.4 30 Z"/>
      <path    class="sh s-thinking" d="M14.3 32 L85.7 32 A40 40 0 1 1 14.3 32 Z"/>
      <path    class="sh s-happy" d="M10 68 A40 40 0 0 1 90 68 A40 18 0 0 0 10 68 Z"/>
    </svg>
  </div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<script>
/* ===== EDIT HERE ===== */
const CONFIG = {
  blinkInterval: 3500,   // ms between blinks (or call setBlinkInterval(ms))
  blinkDuration: 160,    // ms the eyes stay closed
  eyeGap: '14vw',        // distance between the two eyes (px, vw, vh...)
  borderWidth: 8,        // border thickness (1 thin … 14 thick)
  glowSpeed: 2.4         // seconds for one low→high→low glow cycle
};
/* ===================== */

const root = document.documentElement;
const eyes = document.querySelectorAll('.eye');
let blinkTimer = null;

function setEyeGap(v){      root.style.setProperty('--gap', v); }
function setBorderWidth(n){ root.style.setProperty('--bw', n); }
function setGlowSpeed(sec){ root.style.setProperty('--glow-t', sec + 's'); }
setEyeGap(CONFIG.eyeGap);
setBorderWidth(CONFIG.borderWidth);
setGlowSpeed(CONFIG.glowSpeed);

function setMood(name){ document.body.dataset.mood = name; }

/* Mood functions – call any of these to switch animation */
function mood_default(){  setMood('default');  }   // two triangles
function mood_1(){        setMood('mood_1');   }   // two circles
function mood_angry(){    setMood('angry');    }
function mood_thinking(){ setMood('thinking'); }   // shows 3 animated dots
function mood_happy(){    setMood('happy');    }

/* Blink (both eyes together) */
function blink(){
  eyes.forEach(e => e.style.setProperty('--sy', .06));
  setTimeout(() => eyes.forEach(e => e.style.setProperty('--sy', 1)), CONFIG.blinkDuration);
}
function setBlinkInterval(ms){
  CONFIG.blinkInterval = ms;
  clearInterval(blinkTimer);
  blinkTimer = setInterval(blink, 10000);
}
setBlinkInterval(CONFIG.blinkInterval);

/* Quick testing: keys 0-4 (remove if not needed) */
const keyMap = {0:mood_default, 1:mood_1, 2:mood_angry, 3:mood_thinking, 4:mood_happy};
addEventListener('keydown', e => keyMap[e.key] && keyMap[e.key]());

// FUNCTION CALL LOGIC

// Helper function to handle delays
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// Define your 5 functions
const func1 = async () => console.log("-> Running Function 1");
const func2 = async () => console.log("-> Running Function 2");
const func3 = async () => console.log("-> Running Function 3");
const func4 = async () => console.log("-> Running Function 4");
const func5 = async () => console.log("-> Running Function 5");

const tasks = [mood_default, mood_thinking, mood_1];
const intervalMs = 12000; // Time interval between functions (in milliseconds)

async function startSequenceLoop() {
  while (true) {
    console.log("\n--- Starting a new cycle ---");
    
    for (let i = 0; i < tasks.length; i++) {
      await tasks[i](); // Execute the current function
      
      // Wait for the interval before moving to the next function
      await wait(intervalMs);
    }
    
    console.log("Cycle complete. Resetting...");
    await wait(intervalMs); // Optional pause before restarting the loop
  }
}

// Run the loop
startSequenceLoop();















// AI













console.log("started ok");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

console.log("started const ok");

if (!SpeechRecognition) {
    alert("Speech recognition is not supported on this browser. Try Google Chrome on Android.");
}

console.log("started if ok");

const recognition = new SpeechRecognition();
recognition.continuous = false; // Must be false for stable mobile execution
recognition.interimResults = false;
recognition.lang = 'en-US';

const statusText = document.getElementById('status'); // Optional text element to show state

console.log("click now");


// Triggered when user taps the screen/eyes
document.body.addEventListener('click', () => {
    try {
        recognition.start();
        console.log("Listening started...");
    } catch (e) {
        console.log("Already active or waiting");
    }
});

recognition.onstart = () => {
    setRobotExpression("listening");
    console.log("Mic is live - say 'Wolf' followed by your command.");
};

recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.trim().toLowerCase();
    console.log("Heard:", transcript);

    if (transcript.includes("wolf")) {
        const command = transcript.split("wolf")[1]?.trim();
        handleVoiceCommand(command || "hello");
    } else {
        setRobotExpression("idle");
    }
};

recognition.onerror = (event) => {
    console.error("Speech error:", event.error);
    setRobotExpression("idle");
};

// Automatically restart listening loop when recognition ends
recognition.onend = () => {
    setRobotExpression("idle");
    // Restart after a brief pause so it acts like a continuous assistant
    setTimeout(() => {
        try { recognition.start(); } catch (e) {}
    }, 1000);
};

function setRobotExpression(state) {
    // Switch your CSS classes here (e.g., document.getElementById('eyes').className = state;)
    console.log("Robot state:", state);
}

function handleVoiceCommand(query) {
    setRobotExpression("thinking");
    
    let response = "I am listening.";
    if (query.includes("time")) {
        response = "The time is " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    } else {
        response = "You said: " + query;
    }

    speakText(response);
}

function speakText(text) {
    setRobotExpression("speaking");
    const utterance = new SpeechSynthesisUtterance(text);
    
    utterance.onend = () => {
        setRobotExpression("idle");
    };
    
    window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
